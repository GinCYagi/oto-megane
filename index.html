<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>音めがね</title>
  <link rel="stylesheet" href="css/style.css?v=5">
  <link rel="stylesheet" href="css/uta.css?v=5">
</head>
<body class="uta">
  <section id="list-view" class="list-view">
    <h1>音めがね</h1>
    <p class="lead">歌の高さを、線の上下で見せます。曲名を押してください。</p>
    <ul id="song-list" class="song-list"></ul>
    <p id="list-status" class="song-status" aria-live="polite"></p>
    <footer>
      <p>医療機器ではありません。聞こえを診断・治療・改善するものではありません。</p>
      <p><a class="quiet-link" href="lab.html">試しの音・マイク・曲のファイルを見る（実験のページ）</a></p>
    </footer>
  </section>

  <section id="play-view" class="play-view" hidden>
    <div class="play-bar">
      <h2 id="play-title" class="play-title"></h2>
      <button id="btn-back" type="button">一覧へ</button>
    </div>
    <canvas id="uta-line" class="uta-line" aria-label="歌の高さの線。右から左へ流れ、上ほど高い音。左から 3 分の 1 の縦線が、いま歌っている所"></canvas>
    <p id="play-status" class="play-status" aria-live="polite"></p>
  </section>

  <script type="module" src="js/uta.js?v=5"></script>
</body>
</html>
