<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#17191d">
  <title>音めがね</title>
  <!-- ホーム画面に追加したとき、ブラウザの枠なしで開く（manifest の display: standalone。iPhone は apple-touch-icon を優先する） -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="音めがね">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="stylesheet" href="css/style.css?v=22">
  <link rel="stylesheet" href="css/uta.css?v=22">
</head>
<body class="uta">
  <section id="list-view" class="list-view">
    <h1>音めがね</h1>
    <p class="lead">歌の高さを、線の上下で見せます。曲名を押してください。</p>
    <ul id="song-list" class="song-list"></ul>
    <p id="list-status" class="song-status" aria-live="polite"></p>
    <footer>
      <p>医療機器ではありません。聞こえを診断・治療・改善するものではありません。</p>
      <p><a class="quiet-link" href="lab.html">試しの音・マイク・曲のファイルを見る（実験のページ）</a></p>
    </footer>
  </section>

  <section id="play-view" class="play-view" hidden>
    <div class="play-bar">
      <h2 class="play-title"><span id="play-title"></span> <small id="play-note" class="play-note"></small></h2>
      <button id="btn-back" type="button">一覧へ</button>
    </div>
    <canvas id="uta-map" class="uta-map" role="img" aria-label="曲全体の地図。山の高さは歌の大きさ。縦の印がいまの所で、右の端が曲の終わり"></canvas>
    <canvas id="uta-line" class="uta-line" aria-label="歌の高さの線。右から左へ流れ、上ほど高い音。太さは音の大きさで、大きく歌う所ほど太い。線の上の字が、その音で歌う字。左から 3 分の 1 の縦線が、いま歌っている所"></canvas>
    <div id="lyrics" class="lyrics" aria-live="off"></div>
    <p id="play-status" class="play-status" aria-live="polite"></p>
    <!-- 「まもなく始まります」「とまっています（触ると続き）」「おしまい」。線の段の上に大きく -->
    <p id="play-cue" class="play-cue" aria-live="polite"></p>
    <p id="song-clock" class="song-clock" hidden></p>
    <!-- 見方の一枚（T10）。曲名を押してから、歌が始まる約 1 秒前（前奏の終わり）まで出す。毎回出す（Gin、2026-11-06） -->
    <div id="how-card" class="how-card" hidden>
      <p id="how-wait" class="how-wait">まもなく<ruby>始<rt>はじ</rt></ruby>まります</p>
      <div class="how-rows">
        <div class="how-row">
          <svg class="how-pic" viewBox="0 0 200 40" aria-hidden="true">
            <line x1="8" y1="20" x2="78" y2="20" class="how-thin" />
            <line x1="118" y1="20" x2="192" y2="20" class="how-thick" />
          </svg>
          <p><ruby>線<rt>せん</rt></ruby>の<ruby>太<rt>ふと</rt></ruby>さは<ruby>音<rt>おと</rt></ruby>の<ruby>大<rt>おお</rt></ruby>きさ。<br><ruby>大<rt>おお</rt></ruby>きく<ruby>歌<rt>うた</rt></ruby>う<ruby>所<rt>ところ</rt></ruby>ほど<ruby>太<rt>ふと</rt></ruby>い</p>
        </div>
        <div class="how-row">
          <svg class="how-pic" viewBox="0 0 200 40" aria-hidden="true">
            <text x="30" y="20">う</text><text x="100" y="12">さ</text><text x="170" y="20">ぎ</text>
            <line x1="8" y1="32" x2="56" y2="32" class="how-mid" />
            <line x1="76" y1="24" x2="124" y2="24" class="how-mid" />
            <line x1="146" y1="32" x2="194" y2="32" class="how-mid" />
          </svg>
          <p><ruby>線<rt>せん</rt></ruby>の<ruby>上<rt>うえ</rt></ruby>の<ruby>字<rt>じ</rt></ruby>が、<br>いま<ruby>歌<rt>うた</rt></ruby>っている<ruby>字<rt>じ</rt></ruby></p>
        </div>
      </div>
    </div>
    <!-- 縦向きのときだけ出す。線と伴奏は止めずに裏で流し続け、横にすればそのまま見られる -->
    <div class="rotate-note" role="status">
      <p>スマホを<br>横にしてください</p>
      <button id="btn-back-portrait" type="button">一覧へ</button>
    </div>
  </section>

  <script type="module" src="js/uta.js?v=22"></script>
</body>
</html>
